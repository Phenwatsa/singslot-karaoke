name: CI & Docker Build

on:
  workflow_call:
  pull_request:
    branches: [sprint-1-staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: singslot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/singslot_test?schema=public
      STAFF_PASSWORD: ci-test-staff-pass-123!
      CUSTOMER_PASSWORD: ci-test-cust-pass-123!
      JWT_SECRET: ci-test-jwt-secret-for-testing-only-not-production
      PORT: 8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Check deployment scripts without accessing GCP
        run: |
          bash -n deploy/deploy.sh deploy/release.sh deploy/teardown.sh
          bash deploy/tests/test_deploy_stub.sh
          bash deploy/tests/test_release_stub.sh
          bash deploy/tests/test_teardown_stub.sh
          python3 -m unittest discover -s deploy/tests -p 'test_smoke.py'

      - name: Apply database migrations and seed
        run: |
          cd server
          npx prisma migrate deploy
          npm run prisma:seed
          cd ..

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run server automated tests
        run: npm run test:server

      - name: Run client automated tests
        run: npm run test:client

      - name: Build client and server
        run: npm run build

      - name: Verify Unified Production Dockerfile Build
        run: docker build -t singslot-app:latest .

