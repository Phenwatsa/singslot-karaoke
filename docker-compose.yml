services:
  db:
    image: postgres:16-alpine
    container_name: singslot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-singslot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-singslot}
      POSTGRES_DB: ${POSTGRES_DB:-singslot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-singslot} -d ${POSTGRES_DB:-singslot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: singslot-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-singslot}:${POSTGRES_PASSWORD:-singslot}@db:5432/${POSTGRES_DB:-singslot}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-super-secret-jwt-key-minimum-32-chars!}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-StaffInitial123!}
      CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD:-CustomerInitial123!}
    command: ["sh", "-c", "npx prisma migrate deploy && npm run prisma:seed"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: singslot-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TZ: Asia/Bangkok
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-singslot}:${POSTGRES_PASSWORD:-singslot}@db:5432/${POSTGRES_DB:-singslot}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-super-secret-jwt-key-minimum-32-chars!}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-StaffInitial123!}
      CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD:-CustomerInitial123!}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
